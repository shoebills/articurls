<!DOCTYPE html>
<html>
  <body style="margin:0;padding:0;background:#f3f6fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#0f172a;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f3f6fb;padding:32px 14px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;">
            <tr>
              <td style="padding:0 0 14px;text-align:center;">
                <span style="display:inline-block;border:1px solid #dce4f0;background:#ffffff;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#475569;">
                  Articurls Support
                </span>
              </td>
            </tr>
            <tr>
              <td style="border:1px solid #dce4f0;background:#ffffff;border-radius:16px;padding:28px 24px;">
                <p style="margin:0 0 8px;font-size:12px;line-height:1.4;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#64748b;">
                  {{ category }}
                </p>
                <h1 style="margin:0 0 12px;font-size:22px;line-height:1.25;font-weight:800;color:#0f172a;">
                  {{ subject }}
                </h1>

                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="margin:0 0 16px;border:1px solid #e2e8f0;border-radius:10px;background:#f8fafc;">
                  <tr>
                    <td style="padding:12px 14px;">
                      <p style="margin:0 0 4px;font-size:12px;line-height:1.4;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;">From</p>
                      <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">{{ name }} &lt;{{ email }}&gt;</p>
                      <p style="margin:8px 0 4px;font-size:12px;line-height:1.4;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;">Blog</p>
                      <p style="margin:0;font-size:14px;line-height:1.6;color:#334155;">{{ blog_url }}</p>
                    </td>
                  </tr>
                </table>

                <p style="margin:0 0 4px;font-size:12px;line-height:1.4;font-weight:700;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;">
                  Message
                </p>
                <p style="margin:0 0 16px;font-size:15px;line-height:1.7;color:#334155;white-space:pre-line;">{{ message }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:14px 8px 0;text-align:center;">
                <p style="margin:0;font-size:12px;line-height:1.6;color:#94a3b8;">
                  This message was sent from the Articurls support form.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
